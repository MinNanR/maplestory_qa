<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleStory Knowledge Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍁</text></svg>">
</head>

<body>

<div class="app">

    <header class="header">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-logo">🍁</div>
                <div class="brand-text">
                    <h1>MapleStory 知识助手</h1>
                    <span class="brand-sub">冒险岛 · 职业 · 技能 · 装备 · 伤害公式</span>
                </div>
            </div>

            <div class="header-actions">
                <span id="session-badge" class="session-badge" title="当前会话 ID">会话</span>
                <button id="clear-btn" class="btn btn-ghost" type="button" title="清空当前对话并开启新会话">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
                    </svg>
                    <span>清空对话</span>
                </button>
            </div>
        </div>
    </header>

    <main id="chat" class="chat">
        <!-- 欢迎页 -->
        <section id="welcome" class="welcome">
            <div class="welcome-inner">
                <div class="welcome-logo">🍁</div>
                <h2>你好，冒险家！</h2>
                <p>我是冒险岛知识助手，可以回答职业、技能、装备强化与伤害计算等问题。</p>
                <div class="suggestions">
                    <button class="chip" type="button">阿黛尔职业技能有哪些？</button>
                    <button class="chip" type="button">星之力强化是怎么计算的？</button>
                    <button class="chip" type="button">冒险岛伤害公式是什么？</button>
                    <button class="chip" type="button">升级规则里有哪些要点？</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="input-area-wrap">
        <form id="chat-form" class="input-area" autocomplete="off">
            <textarea
                id="message-input"
                rows="1"
                placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"
            ></textarea>
            <button id="send-btn" class="btn btn-primary" type="submit" aria-label="发送">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </form>
        <p class="input-hint">🍁 回答由知识库检索与 AI 生成，仅供游戏参考</p>
    </footer>

</div>

<script src="/vendor/marked.min.js"></script>
<script src="/sse.js"></script>
<script src="/app.js"></script>

</body>
</html>
